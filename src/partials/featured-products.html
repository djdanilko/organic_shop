<section class="featured-products">
  <div class="container featured-products__container">
    <p class="featured-products__eyebrow">Products</p>
    <h2 class="featured-products__title">Our Featured Products</h2>

    <div class="featured-products__layout">
      <article
        class="featured-products__promo-card featured-products__promo-card--summer"
      >
        <p class="featured-products__promo-label">Summer Sale</p>
        <p class="featured-products__promo-title">75% off</p>
        <button class="featured-products__promo-button" type="button">
          Shop Now
          <svg class="featured-products__promo-icon" width="15" height="12">
            <use href="./img/svg-sprite.svg#icon-go"></use>
          </svg>
        </button>
      </article>

      <ul
        class="featured-products__main-list"
        id="featured-products-list"
        aria-label="Featured products"
      ></ul>

      <div class="featured-products__columns">
        <section class="featured-products__column">
          <h3 class="featured-products__column-title">Hot Deals</h3>
          <ul
            class="featured-products__compact-list"
            id="hot-deals-list"
            aria-label="Hot deals products"
          ></ul>
        </section>

        <section class="featured-products__column">
          <h3 class="featured-products__column-title">Best Seller</h3>
          <ul
            class="featured-products__compact-list"
            id="best-seller-list"
            aria-label="Best seller products"
          ></ul>
        </section>

        <section class="featured-products__column">
          <h3 class="featured-products__column-title">Top Rated</h3>
          <ul
            class="featured-products__compact-list"
            id="top-rated-list"
            aria-label="Top rated products"
          ></ul>
        </section>
      </div>

      <article
        class="featured-products__promo-card featured-products__promo-card--hot-sale"
      >
        <p class="featured-products__promo-label">Hot Sale</p>
        <p class="featured-products__promo-heading">
          Save 37% <span>on Every Order</span>
        </p>
        <button class="featured-products__promo-button" type="button">
          Shop Now
          <svg class="featured-products__promo-icon" width="15" height="12">
            <use href="./img/svg-sprite.svg#icon-go"></use>
          </svg>
        </button>
      </article>
    </div>
  </div>
</section>
